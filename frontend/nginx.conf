server {
    listen 80;
    server_name localhost *.localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión Gzip para alto rendimiento en conexiones de kioscos
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy inverso transparente hacia la API backend en la red Docker
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header x-tenant-subdomain $http_x_tenant_subdomain;
        proxy_cache_bypass $http_upgrade;
    }

    # SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Desactivar logs para favicon
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
